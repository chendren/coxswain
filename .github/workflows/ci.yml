name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify dist
        run: |
          ls packages/cli/dist/main.js
          ls packages/core/dist/index.js
          node packages/cli/dist/main.js --help
          node packages/cli/dist/main.js doctor --offline

      - name: Verify healthz
        run: |
          node packages/cli/dist/main.js --health | tee /tmp/healthz.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/healthz.json','utf8')); if(j.status!=='ok') throw new Error('healthz status not ok: '+JSON.stringify(j)); console.log('healthz ok', j.version)"
          node packages/cli/dist/main.js health | tee /tmp/healthz2.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/healthz2.json','utf8')); if(j.status!=='ok') throw new Error('health command not ok'); console.log('health command ok')"

      - name: Lint
        run: pnpm lint
        continue-on-error: true # warn until eslint lands in all packages

      - name: Test (with coverage gate 80)
        run: pnpm test:coverage
        env:
          CI: true

      - name: Verify offline commands
        run: |
          pnpm cox --help
          pnpm cox doctor --offline || true
          pnpm cox models || true
          pnpm cox --health
          pnpm cox health

      - name: Upload audit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            **/coverage
            **/*.log
